name: Deploy scientific explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/metadata/samples.tsv'
      - 'results/beta10/tables/**'
      - 'results/module_statistics_beta10/**'
      - 'results/year_robustness_beta10/**'
      - 'results/functional_enrichment_beta10/**'
      - 'results/hub_prioritization_beta10/**'
      - 'results/external_skin_validation_beta10/**'
      - 'results/fastq_reprocessing_t008/**'
      - 'results/integrated_report_t009/**'
      - 'reports/current/**'
      - 'manuscript/**'
      - 'scripts/master/**'
      - 'scripts/post/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export canonical site data
        run: python scripts/export_site_data.py

      - name: Sync canonical reports for publication
        run: python scripts/sync_public_reports.py

      - name: Validate canonical site data
        run: python scripts/validate_site_data.py

      - name: Scientific value QA
        run: python scripts/qa_scientific_values.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: UI consistency
        run: npm run qa:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
        run: npm run build

      - name: Bundle performance budget
        run: npm run qa:bundle

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
